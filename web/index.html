<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="note_work">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.png" />
  <link rel="icon" type="image/x-icon" sizes="512x512" href="icons/Icon-512.png"/>
  <link rel="icon" type="image/x-icon" sizes="192x192" href="icons/Icon-192.png" />

  <title>Note work</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    // Override Flutter loader để ép tải main.dart.js từ CDN
    const flutterLoader = window._flutter ?? (window._flutter = {});
    flutterLoader.loader = flutterLoader.loader || {};
    flutterLoader.loader.load = function (config) {
      // Ép URL CDN
      config.mainJsPath = "https://cdn.jsdelivr.net/gh/quoctuyenit/note-work@gh-pages/main.dart.js";
      console.log("%c✅ main.dart.js will be loaded from CDN!", "color:lime;font-weight:bold");
      return import(config.mainJsPath);
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>

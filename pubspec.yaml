name: note_work
description: Note wor app with Drift + Riverpod
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  provider: ^6.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "favicon-full.png"

  web:
    generate: true
    image_path: "favicon-full.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"